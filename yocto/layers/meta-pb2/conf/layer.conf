BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pb2"
BBFILE_PATTERN_meta-pb2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pb2 = "10"

LAYERDEPENDS_meta-pb2 = "core"
LAYERSERIES_COMPAT_meta-pb2 = "wrynose"
LAYERVERSION_meta-pb2 = "1"
